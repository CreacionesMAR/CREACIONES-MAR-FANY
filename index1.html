<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8edf0"><title>Un recuerdo para siempre | Creaciones Mar</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px 15px;color:#4a3038;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at top,#fff9fa 0,#f7e9ed 48%,#ead5dc 100%)}
.card{width:min(100%,440px);padding:22px 20px 26px;text-align:center;background:rgba(255,255,255,.86);border:1px solid white;border-radius:28px;box-shadow:0 18px 55px rgba(95,48,65,.14)}
.eyebrow{margin:2px 0 8px;color:#a66d80;font:11px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase}h1{margin:0 0 8px;font-size:clamp(27px,7vw,35px);font-weight:normal}.subtitle{margin:0 0 20px;color:#896b75;font:14px/1.5 Arial,sans-serif}
.photo{display:block;width:100%;max-height:510px;object-fit:cover;border-radius:19px;box-shadow:0 9px 25px rgba(65,35,45,.18)}.heart{color:#bd7189;font-size:23px;margin:16px 0 8px}.message{margin:0 auto 21px;max-width:340px;font-size:17px;line-height:1.55}
button{border:0;border-radius:999px;padding:14px 22px;width:100%;color:white;background:linear-gradient(135deg,#bd7890,#92566f);font:600 14px Arial,sans-serif;cursor:pointer;box-shadow:0 7px 18px rgba(146,86,111,.25)}button:active{transform:scale(.985)}.hint{margin:12px 0 0;color:#9b7c86;font:11px Arial,sans-serif}audio{width:100%;margin-top:15px}
</style></head><body><main class="card">
<p class="eyebrow">Creaciones Mar · Un detalle especial</p><h1>Un recuerdo para siempre</h1>
<p class="subtitle">Hay momentos que merecen quedarse cerquita del corazón.</p>
<img class="photo" src="../assets/foto-1.jpg" alt="Fotografía especial">
<div class="heart">♡</div><p class="message">Un recuerdo bonito que siempre quiero llevar conmigo. ♡</p>
<button id="play" type="button">♫ &nbsp; Reproducir nuestra canción</button>
<p class="hint">Toca el botón para escuchar la canción.</p>
<audio id="song" preload="metadata" src="../assets/cancion.mp3"></audio>
</main><script>
const song=document.getElementById('song'),button=document.getElementById('play');
button.addEventListener('click',async()=>{try{if(song.paused){await song.play();button.innerHTML='Ⅱ &nbsp; Pausar canción'}else{song.pause();button.innerHTML='♫ &nbsp; Reproducir nuestra canción'}}catch(e){button.textContent='No se pudo reproducir. Intenta de nuevo.'}});
song.addEventListener('ended',()=>button.innerHTML='♫ &nbsp; Reproducir nuestra canción');
</script></body></html>
